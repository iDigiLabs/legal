T.pt = { ...T.en, language:"Idioma", brandSub:"Uma política para nossos serviços digitais", eyebrow:"Privacidade explicada com clareza", title:"Política de Privacidade", lead:"Esta Política de Privacidade explica como tratamos informações em aplicativos móveis, sites e serviços digitais relacionados publicados ou operados por {{publisher}}.", effective:"Em vigor desde: {{date}}", scopeChip:"Apps, sites e serviços relacionados", noNames:"Sem política separada por aplicativo", toc:"Conteúdo", names:{scope:"Escopo",data:"Informações que podemos processar",permissions:"Permissões do dispositivo",purposes:"Como usamos as informações",thirdparties:"Serviços de terceiros",ads:"Publicidade",retention:"Retenção de dados",security:"Segurança",rights:"Suas escolhas e direitos",children:"Crianças",transfers:"Processamento internacional",changes:"Alterações desta política",contact:"Contato"}, body:{scope:["Esta política se aplica a aplicativos móveis, sites e serviços digitais relacionados publicados ou operados por {{publisher}} (em conjunto, os “Serviços”). Um Serviço específico pode não utilizar todas as categorias descritas abaixo.","Se um Serviço exigir práticas de privacidade materialmente diferentes, um aviso adicional poderá ser exibido dentro desse Serviço. A URL permanente desta política poderá permanecer a mesma."],data:["Dependendo do Serviço e dos recursos utilizados, podemos processar informações técnicas e operacionais, como dados do dispositivo e do aplicativo, versão do sistema operacional, idioma, informações de rede, metadados de solicitação, diagnósticos ou falhas, uso de recursos e preferências armazenadas localmente.","Alguns Serviços podem processar informações fornecidas ativamente por você, como texto digitado em formulários, configurações, itens salvos, mensagens de suporte ou outro conteúdo necessário para fornecer o recurso solicitado.","Um Serviço também pode processar dados públicos ou técnicos da internet que você solicite consultar ou analisar, como informações de domínio, DNS, certificados, rede ou sites."],permissions:["Alguns Serviços podem solicitar permissões do sistema operacional quando um recurso exigir, por exemplo notificações, localização, câmera, microfone, arquivos/mídia, contatos, Bluetooth ou dispositivos próximos. As permissões são solicitadas apenas quando relevantes e permanecem sujeitas aos controles do seu dispositivo.","Nem todos os Serviços solicitam essas permissões. Você pode revisá-las ou revogá-las a qualquer momento nas configurações do dispositivo."],purposes:["Processamos informações apenas quando razoavelmente necessário para fornecer recursos solicitados, operar e manter os Serviços, lembrar preferências, proteger contra uso indevido, diagnosticar problemas, melhorar a confiabilidade, comunicar com você, cumprir obrigações legais e, quando aplicável, exibir ou medir publicidade."],thirdparties:["Alguns Serviços podem depender de provedores terceiros para distribuição de aplicativos, publicidade, análises, relatórios de falhas, notificações, hospedagem, rede, pagamentos ou outra infraestrutura. Esses provedores processam informações conforme seus próprios termos e políticas de privacidade.","Os provedores exatos podem variar conforme o Serviço, plataforma, região e recurso. Exemplos podem incluir serviços de plataforma do Google ou Apple e, quando habilitados, serviços de publicidade como Google Mobile Ads (AdMob)."],ads:["Alguns Serviços podem exibir publicidade. Provedores de anúncios podem processar identificadores, informações do dispositivo, localização aproximada derivada da rede, dados de interação e outras informações permitidas pelas configurações de privacidade do dispositivo para exibir, limitar, medir ou personalizar anúncios quando legalmente permitido.","Quando consentimento ou outra base legal for exigida, os controles aplicáveis poderão ser apresentados antes da publicidade personalizada. Não vendemos dados pessoais por dinheiro. Certas atividades de publicidade podem ser consideradas “compartilhamento” ou “venda” em algumas leis; quando exigido, fornecemos as opções aplicáveis."],retention:["Mantemos informações apenas pelo tempo razoavelmente necessário à finalidade do processamento, ao cumprimento de obrigações legais ou de segurança, ou à manutenção do Serviço. Os prazos variam conforme os dados e o recurso.","Dados armazenados apenas no seu dispositivo — como preferências, histórico, itens salvos, caches ou listas de monitoramento — podem permanecer até você excluí-los, limpar os dados do aplicativo ou desinstalar o Serviço. Logs e caches no servidor podem ser mantidos por períodos operacionais e de segurança limitados."],security:["Usamos salvaguardas técnicas e organizacionais razoáveis destinadas a proteger informações contra acesso, alteração, divulgação ou perda não autorizados. Nenhum método de transmissão ou armazenamento é totalmente seguro, portanto segurança absoluta não pode ser garantida."],rights:["Dependendo de sua localização e das informações envolvidas, você pode ter direitos de acesso, correção, exclusão, restrição, oposição ou obtenção de uma cópia de dados pessoais, além de retirar consentimento quando o processamento se basear nele.","Você também pode gerenciar várias escolhas de privacidade por meio de permissões do dispositivo, notificações, controles de publicidade, configurações do aplicativo ou exclusão de dados locais. Para uma solicitação de privacidade, entre em contato conosco abaixo."],children:["Os Serviços não têm como objetivo coletar conscientemente informações pessoais de crianças abaixo da idade exigida pela legislação aplicável, salvo quando um Serviço for expressamente destinado a crianças e oferecer as proteções e divulgações exigidas. Se você acredita que uma criança forneceu informações inadequadamente, entre em contato conosco."],transfers:["Provedores de serviço podem processar informações em países diferentes daquele em que você reside. Quando exigido, utilizamos salvaguardas adequadas ou mecanismos de transferência permitidos pela legislação aplicável."],changes:["Podemos atualizar esta política quando nossas práticas, Serviços, provedores ou requisitos legais mudarem materialmente. A mesma URL permanente poderá continuar a ser usada. Em caso de mudanças significativas, também poderemos fornecer aviso adicional quando apropriado."],contact:["Para dúvidas, solicitações ou preocupações de privacidade, entre em contato pelo e-mail {{email}}. Inclua informações suficientes para entendermos sua solicitação, mas não envie senhas, dados de cartão ou outras informações sensíveis desnecessárias."]}, note:"Esta política universal foi criada para permanecer em uma URL permanente. Se um Serviço futuro introduzir práticas de dados materialmente diferentes, a política ou um aviso dentro do Serviço poderá precisar ser atualizado para permanecer correto.", contactBtn:"Contato de privacidade", footer:"Política de Privacidade • {{publisher}}", footerLegal:"Esta página armazena apenas sua preferência de idioma localmente no navegador." };
T.tr = { ...T.en, language:"Dil", brandSub:"Dijital hizmetlerimiz için tek gizlilik politikası", eyebrow:"Gizlilik, açık ve anlaşılır", title:"Gizlilik Politikası", lead:"Bu Gizlilik Politikası, {{publisher}} tarafından yayınlanan veya işletilen mobil uygulamalar, web siteleri ve ilgili dijital hizmetlerde bilgilerin nasıl işlendiğini açıklar.", effective:"Yürürlük tarihi: {{date}}", scopeChip:"Uygulamalar, web siteleri ve ilgili hizmetler", noNames:"Uygulama başına ayrı politika gerekmez", toc:"İçindekiler", names:{scope:"Kapsam",data:"İşleyebileceğimiz bilgiler",permissions:"Cihaz izinleri",purposes:"Bilgileri nasıl kullanırız",thirdparties:"Üçüncü taraf hizmetleri",ads:"Reklamlar",retention:"Veri saklama",security:"Güvenlik",rights:"Tercihleriniz ve haklarınız",children:"Çocuklar",transfers:"Uluslararası işleme",changes:"Bu politikadaki değişiklikler",contact:"İletişim"}, body:{scope:["Bu politika, {{publisher}} tarafından yayınlanan veya işletilen mobil uygulamalar, web siteleri ve ilgili dijital hizmetler (birlikte “Hizmetler”) için geçerlidir. Belirli bir Hizmet aşağıda açıklanan kategorilerin tümünü kullanmayabilir.","Bir Hizmet önemli ölçüde farklı bir gizlilik uygulaması gerektirirse, o Hizmet içinde ek bir bildirim gösterilebilir. Kalıcı gizlilik politikası URL’si aynı kalabilir."],data:["Hizmete ve kullandığınız özelliklere bağlı olarak cihaz ve uygulama bilgileri, işletim sistemi sürümü, dil, ağ bilgileri, istek meta verileri, tanılama veya çökme bilgileri, özellik kullanımı ve yerel tercihler gibi teknik ve operasyonel bilgiler işlenebilir.","Bazı Hizmetler, forma yazdığınız metin, ayarlar, kaydedilmiş öğeler, destek mesajları veya istediğiniz özelliği sunmak için gerekli diğer içerikler gibi sizin aktif olarak sağladığınız bilgileri işleyebilir.","Bir Hizmet ayrıca alan adı, DNS, sertifika, ağ veya web sitesi bilgileri gibi sizin sorgulanmasını ya da analiz edilmesini istediğiniz herkese açık veya teknik internet verilerini işleyebilir."],permissions:["Bazı Hizmetler bir özellik gerektirdiğinde bildirimler, konum, kamera, mikrofon, dosyalar/medya, kişiler, Bluetooth veya yakındaki cihazlar gibi işletim sistemi izinleri isteyebilir. İzinler yalnızca ilgili özellik gerektiğinde istenir ve cihazınızdaki denetimlere tabidir.","Her Hizmet bu izinleri istemez. İzinları cihaz ayarlarından istediğiniz zaman inceleyebilir veya geri çekebilirsiniz."],purposes:["Bilgileri yalnızca talep edilen özellikleri sağlamak, Hizmetleri işletmek ve sürdürmek, tercihleri hatırlamak, kötüye kullanımı önlemek, sorunları teşhis etmek, güvenilirliği artırmak, sizinle iletişim kurmak, yasal yükümlülüklere uymak ve uygun olduğunda reklam sunmak veya ölçmek için makul ölçüde gerekli olduğu kadar işleriz."],thirdparties:["Bazı Hizmetler uygulama dağıtımı, reklam, analiz, çökme raporlama, bildirim, barındırma, ağ, ödeme veya diğer altyapı işlevleri için üçüncü taraf sağlayıcılara dayanabilir. Bu sağlayıcılar bilgileri kendi şartları ve gizlilik politikaları kapsamında işler.","Kullanılan sağlayıcılar Hizmete, platforma, bölgeye ve özelliğe göre değişebilir. Örnekler arasında Google veya Apple platform hizmetleri ve etkinleştirildiğinde Google Mobile Ads (AdMob) gibi reklam hizmetleri bulunabilir."],ads:["Bazı Hizmetler reklam gösterebilir. Reklam sağlayıcıları, reklamları sunmak, sınırlamak, ölçmek veya hukuken izin verildiğinde kişiselleştirmek için tanımlayıcıları, cihaz bilgilerini, ağdan türetilen yaklaşık konumu, etkileşim verilerini ve cihaz/gizlilik ayarlarınızın izin verdiği diğer bilgileri işleyebilir.","Onay veya başka bir yasal dayanak gerektiğinde, kişiselleştirilmiş reklamdan önce ilgili kontroller sunulabilir. Kişisel verileri para karşılığında satmıyoruz. Bazı reklam faaliyetleri belirli yasalar kapsamında “paylaşım” veya “satış” sayılabilir; gerekli olduğunda uygun tercih seçenekleri sağlanır."],retention:["Bilgileri yalnızca işleme amacı, yasal veya güvenlik yükümlülükleri ya da Hizmetin sürdürülmesi için makul ölçüde gerekli olduğu süre boyunca saklarız. Saklama süreleri veri ve özelliğe göre değişir.","Yalnızca cihazınızda saklanan tercihler, geçmiş, kaydedilen öğeler, önbellekler veya izleme listeleri siz silene, uygulama verilerini temizleyene veya Hizmeti kaldırana kadar kalabilir. Sunucu günlükleri ve önbellekleri sınırlı operasyonel ve güvenlik süreleri boyunca saklanabilir."],security:["Bilgileri yetkisiz erişim, değişiklik, açıklama veya kayıptan korumak amacıyla makul teknik ve organizasyonel önlemler kullanırız. Hiçbir iletim veya depolama yöntemi tamamen güvenli değildir; mutlak güvenlik garanti edilemez."],rights:["Bulunduğunuz yere ve ilgili bilgilere bağlı olarak kişisel verilere erişme, düzeltme, silme, kısıtlama, itiraz etme veya bir kopyasını alma; ayrıca işleme onaya dayanıyorsa onayı geri çekme haklarına sahip olabilirsiniz.","Birçok gizlilik tercihini cihaz izinleri, bildirim ayarları, reklam kontrolleri, uygulama ayarları veya yerel verileri silerek de yönetebilirsiniz. Gizlilik talebi için aşağıdaki iletişim adresini kullanın."],children:["Hizmetler, belirli bir Hizmet açıkça çocuklar için tasarlanmadıkça ve gerekli korumalar ile açıklamaları sağlamadıkça, yürürlükteki yasaların öngördüğü yaşın altındaki çocuklardan bilerek kişisel bilgi toplamayı amaçlamaz. Bir çocuğun uygunsuz şekilde bilgi sağladığını düşünüyorsanız bizimle iletişime geçin."],transfers:["Hizmet sağlayıcılar bilgileri yaşadığınız ülke dışındaki ülkelerde işleyebilir. Gerektiğinde uygun güvenlik önlemleri veya yürürlükteki hukukun izin verdiği aktarım mekanizmaları kullanırız."],changes:["Uygulamalarımız, Hizmetlerimiz, sağlayıcılarımız veya yasal gereksinimler önemli ölçüde değiştiğinde bu politikayı güncelleyebiliriz. Aynı kalıcı URL kullanılmaya devam edebilir. Önemli değişikliklerde uygun olduğunda ek bildirim sağlayabiliriz."],contact:["Gizlilikla ilgili soru, talep veya endişeler için {{email}} adresinden bize ulaşın. Talebinizi anlamamıza yetecek bilgi verin; ancak şifre, ödeme kartı bilgisi veya gereksiz hassas bilgiler göndermeyin."]}, note:"Bu evrensel politika, tek ve kalıcı bir URL’de kullanılmak üzere hazırlanmıştır. Gelecekteki bir Hizmet önemli ölçüde farklı veri uygulamaları kullanırsa, doğruluğu korumak için politika veya Hizmet içi bir bildirim güncellenebilir.", contactBtn:"Gizlilik için iletişim", footer:"Gizlilik Politikası • {{publisher}}", footerLegal:"Bu sayfa yalnızca dil tercihinizi tarayıcınızda yerel olarak saklar." };
T.ru = { ...T.en, language:"Язык", brandSub:"Единая политика для наших цифровых сервисов", eyebrow:"Конфиденциальность — понятно", title:"Политика конфиденциальности", lead:"Эта Политика объясняет, как мы обрабатываем информацию в мобильных приложениях, на сайтах и в связанных цифровых сервисах, публикуемых или управляемых {{publisher}}.", effective:"Действует с: {{date}}", scopeChip:"Приложения, сайты и связанные сервисы", noNames:"Отдельная политика для каждого приложения не требуется", toc:"Содержание", names:{scope:"Область действия",data:"Информация, которую мы можем обрабатывать",permissions:"Разрешения устройства",purposes:"Как используется информация",thirdparties:"Сторонние сервисы",ads:"Реклама",retention:"Хранение данных",security:"Безопасность",rights:"Ваш выбор и права",children:"Дети",transfers:"Международная обработка",changes:"Изменения политики",contact:"Контакты"}, body:{scope:["Эта политика применяется к мобильным приложениям, веб-сайтам и связанным цифровым сервисам, публикуемым или управляемым {{publisher}} (совместно — «Сервисы»). Конкретный Сервис может не использовать все описанные ниже категории.","Если Сервису требуются существенно иные практики конфиденциальности, внутри него может быть показано дополнительное уведомление. Постоянный URL этой политики может остаться тем же."],data:["В зависимости от Сервиса и используемых функций мы можем обрабатывать техническую и операционную информацию: сведения об устройстве и приложении, версию ОС, язык, сетевые данные, метаданные запросов, диагностику или сведения о сбоях, использование функций и локальные настройки.","Некоторые Сервисы могут обрабатывать информацию, которую вы предоставляете сами: введенный текст, настройки, сохраненные элементы, сообщения в поддержку или другой контент, необходимый для запрошенной функции.","Сервис также может обрабатывать публичные или технические данные Интернета, которые вы просите получить или проанализировать, например сведения о домене, DNS, сертификатах, сети или сайте."],permissions:["Некоторые Сервисы могут запрашивать разрешения операционной системы, когда это требуется функции, например уведомления, геолокацию, камеру, микрофон, файлы/медиа, контакты, Bluetooth или доступ к устройствам поблизости. Разрешения запрашиваются только при необходимости и управляются настройками вашего устройства.","Не каждый Сервис запрашивает такие разрешения. Вы можете просмотреть или отозвать их в настройках устройства."],purposes:["Мы обрабатываем информацию только в объеме, разумно необходимом для предоставления функций, работы и поддержки Сервисов, сохранения настроек, защиты от злоупотреблений, диагностики проблем, повышения надежности, связи с вами, выполнения правовых обязательств и, где применимо, показа или измерения рекламы."],thirdparties:["Некоторые Сервисы могут использовать сторонних поставщиков для распространения приложений, рекламы, аналитики, отчетов о сбоях, уведомлений, хостинга, сетевой инфраструктуры, платежей или иных функций. Такие поставщики обрабатывают информацию в соответствии со своими условиями и политиками конфиденциальности.","Конкретные поставщики могут различаться в зависимости от Сервиса, платформы, региона и функции. Примерами являются платформенные сервисы Google или Apple и, если включено, рекламные сервисы вроде Google Mobile Ads (AdMob)."],ads:["Некоторые Сервисы могут показывать рекламу. Рекламные поставщики могут обрабатывать идентификаторы, сведения об устройстве, приблизительное местоположение, полученное из сетевых данных, данные взаимодействия и иную информацию, разрешенную настройками устройства и конфиденциальности, чтобы показывать, ограничивать, измерять или персонализировать рекламу, где это допускается законом.","Если требуется согласие или иное правовое основание, соответствующие элементы управления могут быть предоставлены до персонализированной рекламы. Мы не продаем персональные данные за деньги. Некоторые рекламные действия могут считаться «передачей» или «продажей» по отдельным законам; где требуется, предоставляются соответствующие варианты выбора."],retention:["Мы храним информацию только столько, сколько разумно необходимо для цели обработки, выполнения правовых или защитных обязательств либо поддержки Сервиса. Сроки зависят от типа данных и функции.","Данные, хранящиеся только на вашем устройстве — настройки, история, сохраненные элементы, кэши или списки наблюдения — могут оставаться до удаления вами, очистки данных приложения или удаления Сервиса. Серверные журналы и кэши могут храниться ограниченное время для эксплуатации и безопасности."],security:["Мы применяем разумные технические и организационные меры для защиты информации от несанкционированного доступа, изменения, раскрытия или утраты. Ни один способ передачи или хранения не является полностью безопасным, поэтому абсолютная безопасность не гарантируется."],rights:["В зависимости от вашей юрисдикции и вида данных вы можете иметь права на доступ, исправление, удаление, ограничение, возражение или получение копии персональной информации, а также на отзыв согласия, если обработка основана на согласии.","Многие настройки приватности также можно контролировать через разрешения устройства, уведомления, рекламные настройки, параметры приложения или удаление локальных данных. Для запроса по конфиденциальности свяжитесь с нами ниже."],children:["Сервисы не предназначены для сознательного сбора персональной информации детей младше возраста, установленного применимым законодательством, если только конкретный Сервис прямо не предназначен для детей и не содержит требуемых мер защиты и уведомлений. Если вы считаете, что ребенок ненадлежащим образом предоставил данные, свяжитесь с нами."],transfers:["Поставщики могут обрабатывать информацию в странах, отличных от страны вашего проживания. Где требуется, мы используем соответствующие гарантии или законные механизмы передачи данных."],changes:["Мы можем обновлять эту политику при существенном изменении наших практик, Сервисов, поставщиков или юридических требований. Тот же постоянный URL может использоваться и дальше. При значительных изменениях мы также можем предоставить дополнительное уведомление."],contact:["По вопросам, запросам или проблемам конфиденциальности напишите на {{email}}. Укажите достаточно информации, чтобы мы поняли запрос, но не отправляйте пароли, данные банковских карт или иную ненужную чувствительную информацию."]}, note:"Эта универсальная политика рассчитана на постоянный URL. Если будущий Сервис будет существенно отличаться по обработке данных, политику или уведомление внутри Сервиса может потребоваться обновить.", contactBtn:"Связаться по вопросам конфиденциальности", footer:"Политика конфиденциальности • {{publisher}}", footerLegal:"Эта страница хранит локально в браузере только выбранный язык." };
T.ja = { ...T.en, language:"言語", brandSub:"デジタルサービス共通のプライバシーポリシー", eyebrow:"プライバシーをわかりやすく", title:"プライバシーポリシー", lead:"本プライバシーポリシーは、{{publisher}} が公開または運営するモバイルアプリ、ウェブサイト、および関連デジタルサービスにおける情報の取り扱いについて説明します。", effective:"施行日: {{date}}", scopeChip:"アプリ・ウェブサイト・関連サービス", noNames:"アプリごとの個別ポリシーは不要", toc:"目次", names:{scope:"適用範囲",data:"処理する可能性のある情報",permissions:"端末の権限",purposes:"情報の利用目的",thirdparties:"第三者サービス",ads:"広告",retention:"データ保持",security:"セキュリティ",rights:"選択肢と権利",children:"子ども",transfers:"国際的な処理",changes:"本ポリシーの変更",contact:"お問い合わせ"}, body:{scope:["本ポリシーは、{{publisher}} が公開または運営するモバイルアプリ、ウェブサイト、および関連デジタルサービス（総称して「サービス」）に適用されます。各サービスが以下のすべての項目を利用するとは限りません。","サービスで大きく異なるプライバシー上の取り扱いが必要な場合、そのサービス内で追加のお知らせを表示することがあります。恒久的なプライバシーポリシーURLは同じまま利用できます。"],data:["サービスや利用機能に応じて、端末・アプリ情報、OSバージョン、言語、ネットワーク情報、リクエストのメタデータ、診断・クラッシュ情報、機能利用状況、端末内の設定などの技術的・運用上の情報を処理する場合があります。","一部のサービスでは、フォームに入力したテキスト、設定、保存項目、サポートメッセージなど、利用者が能動的に提供した情報を処理することがあります。","また、ドメイン、DNS、証明書、ネットワーク、ウェブサイト情報など、利用者が取得または解析を依頼した公開・技術情報を処理する場合があります。"],permissions:["機能に必要な場合、通知、位置情報、カメラ、マイク、ファイル/メディア、連絡先、Bluetooth、周辺デバイスなどのOS権限を求めることがあります。権限は関連する機能に必要な場合のみ求められ、端末側の設定で管理できます。","すべてのサービスがこれらの権限を要求するわけではありません。端末設定からいつでも確認・取り消しできます。"],purposes:["情報は、依頼された機能の提供、サービスの運用・保守、設定の記憶、不正利用防止、問題の診断、信頼性向上、利用者との連絡、法的義務への対応、および該当する場合の広告配信・測定に合理的に必要な範囲でのみ処理します。"],thirdparties:["一部のサービスでは、アプリ配信、広告、分析、クラッシュレポート、通知、ホスティング、ネットワーク、決済などの機能に第三者プロバイダを利用する場合があります。これらの事業者は各自の利用規約・プライバシーポリシーに基づいて情報を処理します。","利用する事業者はサービス、プラットフォーム、地域、機能によって異なります。例としてGoogleやAppleのプラットフォームサービス、広告が有効な場合はGoogle Mobile Ads（AdMob）などがあります。"],ads:["一部のサービスでは広告を表示する場合があります。広告事業者は、広告の配信、頻度制限、測定、または法的に許可される場合のパーソナライズのため、識別子、端末情報、ネットワーク情報から推定されるおおよその位置、操作データ、端末やプライバシー設定で許可されたその他の情報を処理する場合があります。","同意その他の法的根拠が必要な場合、パーソナライズ広告の前に適切な選択肢を提示することがあります。当社は個人データを金銭と引き換えに販売しません。一部法域では広告活動が「共有」または「販売」に該当する場合があり、必要に応じて適切な選択肢を提供します。"],retention:["情報は、処理目的、法的・セキュリティ上の義務、またはサービス維持のために合理的に必要な期間のみ保持します。期間はデータや機能により異なります。","端末内だけに保存される設定、履歴、保存項目、キャッシュ、ウォッチリスト等は、利用者が削除するか、アプリデータを消去するか、サービスをアンインストールするまで残る場合があります。サーバーログやキャッシュは運用・安全上の限定期間保持される場合があります。"],security:["不正アクセス、改ざん、開示、紛失から情報を保護するため、合理的な技術的・組織的対策を講じます。ただし、送信・保存方法に完全な安全性はなく、絶対的な安全を保証することはできません。"],rights:["居住地域や対象情報に応じて、個人情報へのアクセス、訂正、削除、制限、異議申立て、コピー取得、または同意に基づく処理の場合の同意撤回などの権利を有する場合があります。","端末権限、通知設定、広告設定、アプリ設定、端末内データの削除から多くのプライバシー選択を管理できます。プライバシーに関する請求は下記の連絡先へお送りください。"],children:["サービスは、特定のサービスが明示的に子ども向けに設計され必要な保護と説明を提供する場合を除き、適用法で定める年齢未満の子どもから個人情報を意図的に収集することを目的としていません。子どもが不適切に情報を提供したと思われる場合はご連絡ください。"],transfers:["サービス提供者が利用者の居住国外で情報を処理する場合があります。必要な場合は、適切な保護措置または適用法で認められた移転手段を利用します。"],changes:["当社の取扱い、サービス、提供者、法的要件が大きく変わった場合、本ポリシーを更新することがあります。同じ恒久URLを引き続き使用できます。重要な変更では、必要に応じて追加のお知らせを行うことがあります。"],contact:["プライバシーに関する質問、請求、懸念は {{email}} までご連絡ください。内容を理解できる程度の情報をご記載ください。ただしパスワード、カード情報、その他不要な機微情報は送信しないでください。"]}, note:"本ポリシーは、恒久的な1つのURLで利用できるよう設計されています。将来のサービスでデータ取扱いが大きく異なる場合、正確性を保つために本ポリシーまたはサービス内通知を更新することがあります。", contactBtn:"プライバシー窓口へ連絡", footer:"プライバシーポリシー • {{publisher}}", footerLegal:"このページは言語設定のみをブラウザ内に保存します。" };
T["zh-Hans"] = { ...T.en, language:"语言", brandSub:"适用于我们数字服务的一份隐私政策", eyebrow:"清晰说明隐私保护", title:"隐私政策", lead:"本隐私政策说明 {{publisher}} 发布或运营的移动应用、网站及相关数字服务如何处理信息。", effective:"生效日期：{{date}}", scopeChip:"应用、网站及相关服务", noNames:"无需为每个应用单独建立政策", toc:"目录", names:{scope:"适用范围",data:"我们可能处理的信息",permissions:"设备权限",purposes:"信息使用方式",thirdparties:"第三方服务",ads:"广告",retention:"数据保留",security:"安全",rights:"您的选择与权利",children:"儿童",transfers:"跨境处理",changes:"政策变更",contact:"联系我们"}, body:{scope:["本政策适用于 {{publisher}} 发布或运营的移动应用、网站及相关数字服务（统称“服务”）。某一具体服务不一定使用下文所述的全部信息类别。","如果某项服务需要实质不同的隐私处理方式，我们可能会在该服务内提供补充说明，而本隐私政策的永久网址可以保持不变。"],data:["根据具体服务和所使用的功能，我们可能处理设备与应用信息、操作系统版本、语言、网络信息、请求元数据、诊断或崩溃信息、功能使用情况以及本地保存的偏好等技术和运营信息。","部分服务可能处理您主动提供的信息，例如表单中输入的文本、设置、已保存项目、支持消息或提供所请求功能所必需的其他内容。","服务还可能处理您要求查询或分析的公开或技术性互联网数据，例如域名、DNS、证书、网络或网站信息。"],permissions:["当某项功能需要时，部分服务可能请求操作系统权限，例如通知、位置、相机、麦克风、文件/媒体、联系人、蓝牙或附近设备。仅在相关功能需要时请求这些权限，并受您的设备设置控制。","并非所有服务都会请求这些权限。您可以随时在设备设置中查看或撤销权限。"],purposes:["我们仅在合理必要的范围内处理信息，用于提供所请求的功能、运营和维护服务、记住偏好、防止滥用、诊断问题、提高可靠性、与您沟通、履行法律义务，以及在适用情况下投放或衡量广告。"],thirdparties:["部分服务可能依赖第三方提供应用分发、广告、分析、崩溃报告、通知、托管、网络、支付或其他基础设施功能。此类提供商会根据其自身条款和隐私政策处理信息。","实际使用的提供商可能因服务、平台、地区和功能而异。例如可能包括 Google 或 Apple 的平台服务，以及在启用广告时使用 Google Mobile Ads（AdMob）等广告服务。"],ads:["部分服务可能显示广告。广告提供商可能处理标识符、设备信息、由网络信息推断的大致位置、交互数据以及您的设备和隐私设置允许的其他信息，用于投放、限制频次、衡量或在法律允许时个性化广告。","如需征得同意或其他法律依据，我们可能在使用个性化广告前提供适用的控制选项。我们不会以金钱为对价出售个人数据。某些广告活动在部分法律下可能被视为“共享”或“出售”；如有要求，我们会提供相应选择。"],retention:["我们仅在处理目的、法律或安全义务、或维持服务所合理需要的期间保留信息。具体期限取决于数据类型和功能。","仅保存在设备上的数据——如偏好、历史记录、已保存项目、缓存或监控列表——可能会一直保留，直到您将其删除、清除应用数据或卸载服务。服务器日志和缓存可能会在有限的运营和安全期限内保留。"],security:["我们采取合理的技术和组织措施，旨在防止信息遭到未经授权的访问、修改、披露或丢失。任何传输或存储方式都无法做到绝对安全，因此无法保证百分之百的安全性。"],rights:["根据您所在地区及所涉及的信息，您可能享有访问、更正、删除、限制、反对或获取个人信息副本的权利；如处理依据为同意，您也可能有权撤回同意。","您还可以通过设备权限、通知设置、广告控制、应用设置或删除本地数据来管理许多隐私选择。如需提交隐私请求，请通过下方联系方式与我们联系。"],children:["除非某项服务明确面向儿童并提供法律要求的保护与说明，否则服务不会有意收集低于适用法律规定年龄的儿童个人信息。如果您认为儿童不当提供了个人信息，请联系我们。"],transfers:["服务提供商可能在您居住国家/地区之外处理信息。如法律要求，我们会采用适当保障措施或依据适用法律允许的数据传输机制。"],changes:["当我们的做法、服务、提供商或法律要求发生实质变化时，我们可能更新本政策。同一永久网址可以继续使用。若变更重大，我们也可能在适当情况下提供额外通知。"],contact:["如有隐私问题、请求或疑虑，请通过 {{email}} 联系我们。请提供足够信息以便我们理解您的请求，但不要发送密码、银行卡信息或其他不必要的敏感信息。"]}, note:"本通用政策旨在长期使用同一固定网址。如果未来某项服务采用了重大不同的数据处理方式，为保持准确性，我们可能需要更新本政策或在服务内提供额外说明。", contactBtn:"联系隐私团队", footer:"隐私政策 • {{publisher}}", footerLegal:"本页面仅在浏览器本地保存您的语言偏好。" };
T["zh-Hant"] = { ...T.en, language:"語言", brandSub:"適用於我們數位服務的一份隱私政策", eyebrow:"清楚說明隱私保護", title:"隱私權政策", lead:"本隱私權政策說明 {{publisher}} 發布或營運的行動應用程式、網站及相關數位服務如何處理資訊。", effective:"生效日期：{{date}}", scopeChip:"應用程式、網站及相關服務", noNames:"無需為每個應用程式建立個別政策", toc:"目錄", names:{scope:"適用範圍",data:"我們可能處理的資訊",permissions:"裝置權限",purposes:"資訊使用方式",thirdparties:"第三方服務",ads:"廣告",retention:"資料保留",security:"安全性",rights:"您的選擇與權利",children:"兒童",transfers:"跨境處理",changes:"政策變更",contact:"聯絡我們"}, body:{scope:["本政策適用於 {{publisher}} 發布或營運的行動應用程式、網站及相關數位服務（統稱「服務」）。特定服務不一定使用下列所有資訊類別。","若某項服務需要實質不同的隱私處理方式，我們可能在該服務內提供額外說明，而本隱私政策的永久網址可保持不變。"],data:["依服務及所使用的功能，我們可能處理裝置與應用程式資訊、作業系統版本、語言、網路資訊、請求中繼資料、診斷或當機資訊、功能使用情形及本機儲存的偏好等技術與營運資訊。","部分服務可能處理您主動提供的資訊，例如表單中輸入的文字、設定、已儲存項目、支援訊息或提供所要求功能所必需的其他內容。","服務亦可能處理您要求查詢或分析的公開或技術性網際網路資料，例如網域、DNS、憑證、網路或網站資訊。"],permissions:["當功能需要時，部分服務可能要求作業系統權限，例如通知、位置、相機、麥克風、檔案/媒體、聯絡人、藍牙或附近裝置。僅在相關功能需要時要求，並受您的裝置設定控制。","並非所有服務都會要求這些權限。您可隨時於裝置設定中檢視或撤銷。"],purposes:["我們僅在合理必要範圍內處理資訊，用於提供所要求功能、營運與維護服務、記住偏好、防止濫用、診斷問題、提升可靠性、與您聯絡、遵循法律義務，以及在適用時投放或衡量廣告。"],thirdparties:["部分服務可能依賴第三方提供應用程式發佈、廣告、分析、當機報告、通知、託管、網路、付款或其他基礎設施功能。這些供應商依其自身條款與隱私政策處理資訊。","實際使用的供應商可能因服務、平台、地區與功能而異，例如 Google 或 Apple 的平台服務，以及啟用廣告時使用 Google Mobile Ads（AdMob）等廣告服務。"],ads:["部分服務可能顯示廣告。廣告供應商可能處理識別碼、裝置資訊、由網路資訊推估的大致位置、互動資料及裝置與隱私設定允許的其他資訊，以投放、限制頻率、衡量或在法律允許時個人化廣告。","若需取得同意或其他法律依據，我們可能在使用個人化廣告前提供相應控制選項。我們不會以金錢為對價出售個人資料。某些廣告活動在部分法律下可能被視為「分享」或「出售」；如有要求，我們會提供適用的選擇。"],retention:["我們僅在處理目的、法律或安全義務、或維持服務所合理需要的期間保留資訊。保留期間會依資料類型與功能而異。","僅儲存在裝置上的資料——例如偏好、歷史、已儲存項目、快取或監控清單——可能會保留至您刪除、清除應用程式資料或解除安裝服務。伺服器日誌與快取可能在有限的營運與安全期間內保留。"],security:["我們採取合理的技術與組織措施，旨在防止資訊遭未授權存取、變更、揭露或遺失。任何傳輸或儲存方式都無法保證完全安全，因此無法保證絕對安全。"],rights:["依您所在位置與所涉及資訊，您可能享有存取、更正、刪除、限制、反對或取得個人資訊副本的權利；若處理基於同意，也可能有權撤回同意。","您亦可透過裝置權限、通知設定、廣告控制、應用程式設定或刪除本機資料管理許多隱私選擇。如需提出隱私要求，請使用下方聯絡方式。"],children:["除非特定服務明確為兒童設計並提供法律要求的保護與揭露，否則服務不會刻意蒐集低於適用法律規定年齡兒童的個人資訊。若您認為兒童不當提供了個人資訊，請與我們聯絡。"],transfers:["服務供應商可能在您居住國家以外的地區處理資訊。若法律要求，我們會採取適當保障措施或使用適用法律允許的資料移轉機制。"],changes:["當我們的做法、服務、供應商或法律要求有重大變更時，我們可能更新本政策。同一永久網址可以繼續使用。若變更重大，我們亦可能在適當情況下提供額外通知。"],contact:["如有隱私相關問題、要求或疑慮，請透過 {{email}} 聯絡我們。請提供足夠資訊以便我們理解您的要求，但請勿傳送密碼、付款卡資訊或其他不必要的敏感資訊。"]}, note:"本通用政策旨在長期使用同一固定網址。若未來某項服務採用重大不同的資料處理方式，為維持內容正確性，我們可能需要更新本政策或在服務內提供額外說明。", contactBtn:"聯絡隱私團隊", footer:"隱私權政策 • {{publisher}}", footerLegal:"本頁面僅在瀏覽器本機儲存您的語言偏好。" };
T.ko = { ...T.en, language:"언어", brandSub:"디지털 서비스 공통 개인정보처리방침", eyebrow:"개인정보 보호를 명확하게", title:"개인정보처리방침", lead:"본 개인정보처리방침은 {{publisher}}가 게시하거나 운영하는 모바일 앱, 웹사이트 및 관련 디지털 서비스에서 정보를 처리하는 방식을 설명합니다.", effective:"시행일: {{date}}", scopeChip:"앱, 웹사이트 및 관련 서비스", noNames:"앱별 별도 정책 불필요", toc:"목차", names:{scope:"적용 범위",data:"처리할 수 있는 정보",permissions:"기기 권한",purposes:"정보 이용 목적",thirdparties:"제3자 서비스",ads:"광고",retention:"데이터 보관",security:"보안",rights:"선택권 및 권리",children:"아동",transfers:"국제적 처리",changes:"정책 변경",contact:"문의"}, body:{scope:["본 정책은 {{publisher}}가 게시하거나 운영하는 모바일 앱, 웹사이트 및 관련 디지털 서비스(이하 “서비스”)에 적용됩니다. 특정 서비스는 아래의 모든 범주를 사용하지 않을 수 있습니다.","서비스에 실질적으로 다른 개인정보 처리 방식이 필요한 경우 해당 서비스 내에 추가 안내가 표시될 수 있습니다. 개인정보처리방침의 영구 URL은 동일하게 유지될 수 있습니다."],data:["서비스와 사용하는 기능에 따라 기기 및 앱 정보, 운영체제 버전, 언어, 네트워크 정보, 요청 메타데이터, 진단 또는 충돌 정보, 기능 사용 내역, 로컬에 저장된 환경설정 등 기술적·운영적 정보를 처리할 수 있습니다.","일부 서비스는 사용자가 직접 제공하는 정보(예: 입력한 텍스트, 설정, 저장 항목, 지원 메시지 또는 요청한 기능 제공에 필요한 기타 콘텐츠)를 처리할 수 있습니다.","또한 도메인, DNS, 인증서, 네트워크 또는 웹사이트 정보처럼 사용자가 조회하거나 분석하도록 요청한 공개 또는 기술 인터넷 데이터를 처리할 수 있습니다."],permissions:["일부 서비스는 기능에 필요한 경우 알림, 위치, 카메라, 마이크, 파일/미디어, 연락처, Bluetooth 또는 주변 기기와 같은 운영체제 권한을 요청할 수 있습니다. 권한은 관련 기능에 필요한 경우에만 요청되며 기기 설정으로 관리할 수 있습니다.","모든 서비스가 이러한 권한을 요청하는 것은 아닙니다. 기기 설정에서 언제든지 확인하거나 취소할 수 있습니다."],purposes:["정보는 요청한 기능 제공, 서비스 운영 및 유지, 환경설정 기억, 오용 방지, 문제 진단, 안정성 개선, 사용자와의 소통, 법적 의무 준수, 그리고 해당되는 경우 광고 제공 또는 측정에 합리적으로 필요한 범위에서만 처리됩니다."],thirdparties:["일부 서비스는 앱 배포, 광고, 분석, 충돌 보고, 알림, 호스팅, 네트워크, 결제 또는 기타 인프라를 위해 제3자 제공업체를 이용할 수 있습니다. 해당 제공업체는 각자의 약관과 개인정보처리방침에 따라 정보를 처리합니다.","실제 제공업체는 서비스, 플랫폼, 지역 및 기능에 따라 달라질 수 있습니다. 예로 Google 또는 Apple의 플랫폼 서비스와, 광고가 활성화된 경우 Google Mobile Ads(AdMob) 등이 있습니다."],ads:["일부 서비스는 광고를 표시할 수 있습니다. 광고 제공업체는 광고 제공, 빈도 제한, 측정 또는 법적으로 허용되는 경우 개인화를 위해 식별자, 기기 정보, 네트워크에서 추정한 대략적 위치, 상호작용 데이터 및 기기/개인정보 설정이 허용하는 기타 정보를 처리할 수 있습니다.","동의 또는 다른 법적 근거가 필요한 경우 개인화 광고 전에 관련 제어 옵션이 제공될 수 있습니다. 당사는 개인정보를 금전과 교환하여 판매하지 않습니다. 일부 법률에서는 특정 광고 활동을 “공유” 또는 “판매”로 볼 수 있으며, 필요한 경우 관련 선택권을 제공합니다."],retention:["정보는 처리 목적, 법적 또는 보안 의무, 서비스 유지에 합리적으로 필요한 기간 동안만 보관합니다. 보관 기간은 데이터와 기능에 따라 달라집니다.","환경설정, 기록, 저장 항목, 캐시, 모니터링 목록처럼 기기에만 저장되는 데이터는 사용자가 삭제하거나 앱 데이터를 지우거나 서비스를 제거할 때까지 남을 수 있습니다. 서버 로그 및 캐시는 제한된 운영·보안 기간 동안 보관될 수 있습니다."],security:["무단 접근, 변경, 공개 또는 손실로부터 정보를 보호하도록 설계된 합리적인 기술적·관리적 보호조치를 사용합니다. 전송 또는 저장 방식은 완전히 안전할 수 없으므로 절대적인 보안을 보장할 수 없습니다."],rights:["거주 지역과 관련 정보에 따라 개인정보에 대한 접근, 정정, 삭제, 제한, 이의제기 또는 사본 요청 권리와, 동의에 기반한 처리인 경우 동의 철회 권리가 있을 수 있습니다.","기기 권한, 알림 설정, 광고 제어, 앱 설정 또는 로컬 데이터 삭제를 통해 많은 개인정보 선택을 직접 관리할 수 있습니다. 개인정보 관련 요청은 아래 연락처로 보내주세요."],children:["특정 서비스가 명시적으로 아동을 대상으로 설계되고 필요한 보호 및 고지를 제공하는 경우를 제외하고, 서비스는 관련 법률이 정한 연령 미만 아동의 개인정보를 고의로 수집하도록 설계되지 않았습니다. 아동이 부적절하게 개인정보를 제공했다고 생각되면 연락해 주세요."],transfers:["서비스 제공업체는 사용자가 거주하는 국가 외의 지역에서 정보를 처리할 수 있습니다. 필요한 경우 적절한 보호조치 또는 관련 법률이 허용하는 이전 메커니즘을 사용합니다."],changes:["당사의 관행, 서비스, 제공업체 또는 법적 요구사항이 중대하게 변경되는 경우 본 정책을 업데이트할 수 있습니다. 동일한 영구 URL을 계속 사용할 수 있습니다. 중요한 변경 시 적절한 경우 추가 안내를 제공할 수 있습니다."],contact:["개인정보 관련 질문, 요청 또는 우려가 있는 경우 {{email}}로 연락해 주세요. 요청을 이해할 수 있는 충분한 정보를 제공하되, 비밀번호, 결제카드 정보 또는 불필요한 민감정보는 보내지 마세요."]}, note:"이 범용 정책은 하나의 영구 URL에서 계속 사용할 수 있도록 설계되었습니다. 향후 서비스의 데이터 처리 방식이 크게 달라지는 경우 정확성을 유지하기 위해 정책 또는 서비스 내 안내가 업데이트될 수 있습니다.", contactBtn:"개인정보 문의", footer:"개인정보처리방침 • {{publisher}}", footerLegal:"이 페이지는 선택한 언어만 브라우저에 로컬로 저장합니다." };
T.it = { ...T.en, language:"Lingua", brandSub:"Un’unica informativa per i nostri servizi digitali", eyebrow:"Privacy spiegata con chiarezza", title:"Informativa sulla privacy", lead:"Questa Informativa descrive come trattiamo le informazioni nelle applicazioni mobili, nei siti web e nei servizi digitali correlati pubblicati o gestiti da {{publisher}}.", effective:"In vigore dal: {{date}}", scopeChip:"App, siti web e servizi correlati", noNames:"Nessuna informativa separata per ogni app", toc:"Contenuti", names:{scope:"Ambito",data:"Informazioni che possiamo trattare",permissions:"Autorizzazioni del dispositivo",purposes:"Come utilizziamo le informazioni",thirdparties:"Servizi di terze parti",ads:"Pubblicità",retention:"Conservazione dei dati",security:"Sicurezza",rights:"Scelte e diritti",children:"Minori",transfers:"Trattamento internazionale",changes:"Modifiche alla presente informativa",contact:"Contatti"}, body:{scope:["La presente informativa si applica alle applicazioni mobili, ai siti web e ai servizi digitali correlati pubblicati o gestiti da {{publisher}} (congiuntamente, i “Servizi”). Un determinato Servizio potrebbe non utilizzare tutte le categorie descritte di seguito.","Se un Servizio richiede pratiche di privacy sostanzialmente diverse, potrà essere mostrato un avviso aggiuntivo all’interno del Servizio. L’URL permanente della presente informativa potrà restare invariato."],data:["A seconda del Servizio e delle funzioni utilizzate, possiamo trattare informazioni tecniche e operative come dati del dispositivo e dell’app, versione del sistema operativo, lingua, informazioni di rete, metadati delle richieste, dati diagnostici o di crash, utilizzo delle funzioni e preferenze memorizzate localmente.","Alcuni Servizi possono trattare informazioni che fornisci attivamente, come testo inserito, impostazioni, elementi salvati, messaggi di assistenza o altri contenuti necessari per fornire la funzione richiesta.","Un Servizio può inoltre trattare dati Internet pubblici o tecnici che chiedi di recuperare o analizzare, come informazioni su domini, DNS, certificati, rete o siti web."],permissions:["Alcuni Servizi possono richiedere autorizzazioni del sistema operativo quando necessarie a una funzione, ad esempio notifiche, posizione, fotocamera, microfono, file/media, contatti, Bluetooth o dispositivi nelle vicinanze. Le autorizzazioni vengono richieste solo quando pertinenti e restano soggette ai controlli del dispositivo.","Non tutti i Servizi richiedono tali autorizzazioni. Puoi verificarle o revocarle in qualsiasi momento nelle impostazioni del dispositivo."],purposes:["Trattiamo le informazioni solo nella misura ragionevolmente necessaria per fornire le funzioni richieste, gestire e mantenere i Servizi, ricordare le preferenze, prevenire abusi, diagnosticare problemi, migliorare l’affidabilità, comunicare con te, rispettare obblighi legali e, ove applicabile, mostrare o misurare la pubblicità."],thirdparties:["Alcuni Servizi possono utilizzare fornitori terzi per distribuzione delle app, pubblicità, analisi, report di crash, notifiche, hosting, rete, pagamenti o altra infrastruttura. Tali fornitori trattano le informazioni secondo i propri termini e le proprie informative sulla privacy.","I fornitori effettivamente utilizzati possono variare in base a Servizio, piattaforma, regione e funzione. Possono includere servizi di piattaforma Google o Apple e, se attivati, servizi pubblicitari come Google Mobile Ads (AdMob)."],ads:["Alcuni Servizi possono mostrare pubblicità. I fornitori pubblicitari possono trattare identificatori, informazioni del dispositivo, posizione approssimativa derivata dalla rete, dati di interazione e altre informazioni consentite dalle impostazioni del dispositivo e della privacy per mostrare, limitare, misurare o personalizzare gli annunci dove legalmente consentito.","Quando è richiesto il consenso o un’altra base giuridica, possono essere presentati appositi controlli prima della pubblicità personalizzata. Non vendiamo dati personali in cambio di denaro. Alcune attività pubblicitarie possono essere considerate “condivisione” o “vendita” da determinate leggi; ove necessario, forniamo le relative opzioni."],retention:["Conserviamo le informazioni solo per il tempo ragionevolmente necessario allo scopo del trattamento, agli obblighi legali o di sicurezza o al mantenimento del Servizio. I periodi variano in base ai dati e alla funzione.","I dati memorizzati solo sul dispositivo — preferenze, cronologia, elementi salvati, cache o watchlist — possono restare finché non li elimini, cancelli i dati dell’app o disinstalli il Servizio. Log e cache lato server possono essere conservati per periodi operativi e di sicurezza limitati."],security:["Utilizziamo misure tecniche e organizzative ragionevoli progettate per proteggere le informazioni da accesso, modifica, divulgazione o perdita non autorizzati. Nessun metodo di trasmissione o archiviazione è completamente sicuro, quindi non è possibile garantire una sicurezza assoluta."],rights:["A seconda del luogo in cui ti trovi e delle informazioni coinvolte, potresti avere diritti di accesso, rettifica, cancellazione, limitazione, opposizione o copia dei dati personali, nonché il diritto di revocare il consenso quando il trattamento si basa sul consenso.","Puoi inoltre gestire molte scelte tramite autorizzazioni del dispositivo, notifiche, controlli pubblicitari, impostazioni dell’app o cancellazione dei dati locali. Per una richiesta privacy, contattaci qui sotto."],children:["I Servizi non sono destinati a raccogliere consapevolmente informazioni personali da minori al di sotto dell’età prevista dalla legge applicabile, salvo che un Servizio sia espressamente progettato per minori e fornisca le protezioni e informative richieste. Se ritieni che un minore abbia fornito dati in modo improprio, contattaci."],transfers:["I fornitori di servizi possono trattare informazioni in Paesi diversi da quello in cui vivi. Ove richiesto, utilizziamo garanzie adeguate o meccanismi di trasferimento consentiti dalla legge applicabile."],changes:["Possiamo aggiornare questa informativa quando cambiano in modo sostanziale le nostre pratiche, i Servizi, i fornitori o i requisiti legali. Lo stesso URL permanente potrà continuare a essere utilizzato. In caso di cambiamenti significativi, potremo fornire un ulteriore avviso quando opportuno."],contact:["Per domande, richieste o dubbi sulla privacy, scrivici a {{email}}. Fornisci informazioni sufficienti per comprendere la richiesta, ma non inviare password, dati di carte di pagamento o altre informazioni sensibili non necessarie."]}, note:"Questa informativa universale è progettata per rimanere disponibile a un unico URL permanente. Se un futuro Servizio introducesse pratiche sui dati sostanzialmente diverse, l’informativa o un avviso nel Servizio potrebbe dover essere aggiornato per restare accurato.", contactBtn:"Contatto privacy", footer:"Informativa sulla privacy • {{publisher}}", footerLegal:"Questa pagina memorizza localmente nel browser solo la preferenza della lingua." };
T.id = { ...T.en, language:"Bahasa", brandSub:"Satu kebijakan untuk layanan digital kami", eyebrow:"Privasi dijelaskan dengan jelas", title:"Kebijakan Privasi", lead:"Kebijakan Privasi ini menjelaskan cara kami menangani informasi pada aplikasi seluler, situs web, dan layanan digital terkait yang diterbitkan atau dioperasikan oleh {{publisher}}.", effective:"Berlaku sejak: {{date}}", scopeChip:"Aplikasi, situs web & layanan terkait", noNames:"Tidak perlu kebijakan terpisah per aplikasi", toc:"Daftar isi", names:{scope:"Cakupan",data:"Informasi yang dapat kami proses",permissions:"Izin perangkat",purposes:"Cara informasi digunakan",thirdparties:"Layanan pihak ketiga",ads:"Periklanan",retention:"Penyimpanan data",security:"Keamanan",rights:"Pilihan & hak Anda",children:"Anak-anak",transfers:"Pemrosesan internasional",changes:"Perubahan kebijakan",contact:"Kontak"}, body:{scope:["Kebijakan ini berlaku untuk aplikasi seluler, situs web, dan layanan digital terkait yang diterbitkan atau dioperasikan oleh {{publisher}} (secara bersama-sama disebut “Layanan”). Layanan tertentu mungkin tidak menggunakan semua kategori yang dijelaskan di bawah ini.","Jika suatu Layanan memerlukan praktik privasi yang sangat berbeda, pemberitahuan tambahan dapat ditampilkan di dalam Layanan tersebut. URL permanen kebijakan ini dapat tetap sama."],data:["Tergantung pada Layanan dan fitur yang Anda gunakan, kami dapat memproses informasi teknis dan operasional seperti informasi perangkat dan aplikasi, versi sistem operasi, bahasa, informasi jaringan, metadata permintaan, diagnostik atau crash, penggunaan fitur, dan preferensi yang disimpan secara lokal.","Beberapa Layanan dapat memproses informasi yang Anda berikan secara aktif, seperti teks yang dimasukkan, pengaturan, item tersimpan, pesan dukungan, atau konten lain yang diperlukan untuk menyediakan fitur yang Anda minta.","Layanan juga dapat memproses data internet publik atau teknis yang Anda minta untuk diambil atau dianalisis, seperti informasi domain, DNS, sertifikat, jaringan, atau situs web."],permissions:["Beberapa Layanan dapat meminta izin sistem operasi ketika suatu fitur membutuhkannya, misalnya notifikasi, lokasi, kamera, mikrofon, file/media, kontak, Bluetooth, atau perangkat terdekat. Izin hanya diminta saat relevan dan tetap berada di bawah kontrol perangkat Anda.","Tidak semua Layanan meminta izin tersebut. Anda dapat meninjau atau mencabutnya kapan saja melalui pengaturan perangkat."],purposes:["Kami memproses informasi hanya sejauh yang secara wajar diperlukan untuk menyediakan fitur yang diminta, mengoperasikan dan memelihara Layanan, mengingat preferensi, mencegah penyalahgunaan, mendiagnosis masalah, meningkatkan keandalan, berkomunikasi dengan Anda, memenuhi kewajiban hukum, serta bila berlaku menampilkan atau mengukur iklan."],thirdparties:["Beberapa Layanan dapat menggunakan penyedia pihak ketiga untuk distribusi aplikasi, iklan, analitik, laporan crash, notifikasi, hosting, jaringan, pembayaran, atau infrastruktur lainnya. Penyedia tersebut memproses informasi berdasarkan syarat dan kebijakan privasi mereka sendiri.","Penyedia yang digunakan dapat berbeda menurut Layanan, platform, wilayah, dan fitur. Contohnya dapat mencakup layanan platform Google atau Apple dan, bila diaktifkan, layanan iklan seperti Google Mobile Ads (AdMob)."],ads:["Beberapa Layanan dapat menampilkan iklan. Penyedia iklan dapat memproses pengenal, informasi perangkat, perkiraan lokasi yang berasal dari jaringan, data interaksi, dan informasi lain yang diizinkan oleh pengaturan perangkat dan privasi untuk menayangkan, membatasi, mengukur, atau mempersonalisasi iklan bila diizinkan hukum.","Jika persetujuan atau dasar hukum lain diperlukan, kontrol yang sesuai dapat ditampilkan sebelum iklan yang dipersonalisasi digunakan. Kami tidak menjual data pribadi demi uang. Aktivitas iklan tertentu dapat dianggap sebagai “berbagi” atau “penjualan” menurut hukum tertentu; bila diwajibkan, kami menyediakan pilihan yang sesuai."],retention:["Kami menyimpan informasi hanya selama secara wajar diperlukan untuk tujuan pemrosesan, kewajiban hukum atau keamanan, atau pemeliharaan Layanan. Periode penyimpanan berbeda menurut data dan fitur.","Data yang hanya disimpan di perangkat Anda—seperti preferensi, riwayat, item tersimpan, cache, atau daftar pemantauan—dapat tetap ada sampai Anda menghapusnya, membersihkan data aplikasi, atau menghapus Layanan. Log dan cache sisi server dapat disimpan untuk jangka operasional dan keamanan yang terbatas."],security:["Kami menggunakan langkah teknis dan organisasi yang wajar yang dirancang untuk melindungi informasi dari akses, perubahan, pengungkapan, atau kehilangan yang tidak sah. Tidak ada metode transmisi atau penyimpanan yang sepenuhnya aman, sehingga keamanan mutlak tidak dapat dijamin."],rights:["Tergantung pada lokasi Anda dan informasi yang terkait, Anda mungkin memiliki hak untuk mengakses, memperbaiki, menghapus, membatasi, menolak, atau memperoleh salinan informasi pribadi, serta menarik persetujuan bila pemrosesan didasarkan pada persetujuan.","Anda juga dapat mengelola banyak pilihan privasi melalui izin perangkat, pengaturan notifikasi, kontrol iklan, pengaturan aplikasi, atau penghapusan data lokal. Untuk mengajukan permintaan privasi, hubungi kami di bawah ini."],children:["Layanan tidak ditujukan untuk secara sadar mengumpulkan informasi pribadi dari anak-anak di bawah usia yang diwajibkan oleh hukum yang berlaku, kecuali suatu Layanan secara khusus dirancang untuk anak-anak dan menyediakan perlindungan serta pengungkapan yang diwajibkan. Jika Anda yakin seorang anak memberikan informasi secara tidak semestinya, hubungi kami."],transfers:["Penyedia layanan dapat memproses informasi di negara selain negara tempat Anda tinggal. Jika diwajibkan, kami menggunakan perlindungan yang sesuai atau mekanisme transfer yang diizinkan oleh hukum yang berlaku."],changes:["Kami dapat memperbarui kebijakan ini apabila praktik, Layanan, penyedia, atau persyaratan hukum kami berubah secara material. URL permanen yang sama dapat terus digunakan. Untuk perubahan yang signifikan, kami juga dapat memberikan pemberitahuan tambahan bila sesuai."],contact:["Untuk pertanyaan, permintaan, atau kekhawatiran terkait privasi, hubungi kami di {{email}}. Sertakan informasi yang cukup agar kami dapat memahami permintaan Anda, tetapi jangan kirim kata sandi, data kartu pembayaran, atau informasi sensitif lain yang tidak diperlukan."]}, note:"Kebijakan universal ini dirancang untuk tetap menggunakan satu URL permanen. Jika Layanan di masa depan memperkenalkan praktik data yang sangat berbeda, kebijakan atau pemberitahuan di dalam Layanan mungkin perlu diperbarui agar tetap akurat.", contactBtn:"Hubungi privasi", footer:"Kebijakan Privasi • {{publisher}}", footerLegal:"Halaman ini hanya menyimpan preferensi bahasa Anda secara lokal di browser." };

function format(str){return (str||"").replaceAll("{{publisher}}",CONFIG.publisherName).replaceAll("{{email}}",CONFIG.contactEmail).replaceAll("{{date}}",CONFIG.effectiveDate)}
function detectLanguage(){
  const saved=localStorage.getItem("privacyLang"); if(saved && T[saved]) return saved;
  const langs=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"en"];
  for(const raw of langs){const l=raw.toLowerCase();
    if(l.startsWith("zh")){ if(l.includes("tw")||l.includes("hk")||l.includes("mo")||l.includes("hant")) return "zh-Hant"; return "zh-Hans"; }
    const base=l.split("-")[0]; if(T[base]) return base;
  } return "en";
}
function render(lang){
  const t=T[lang]||T.en; document.documentElement.lang=lang; document.title=format(t.title)+" — "+CONFIG.publisherName;
  document.getElementById("brandTitle").textContent=format(t.title);document.getElementById("brandSub").textContent=format(t.brandSub);
  document.getElementById("languageLabel").textContent=t.language;document.getElementById("eyebrow").textContent=t.eyebrow;document.getElementById("heroTitle").textContent=t.title;document.getElementById("heroLead").textContent=format(t.lead);
  document.getElementById("effectiveChip").textContent=format(t.effective);document.getElementById("scopeChip").textContent=t.scopeChip;document.getElementById("noNamesChip").textContent=t.noNames;document.getElementById("tocTitle").textContent=t.toc;
  const nav=document.getElementById("tocNav"), content=document.getElementById("content");nav.innerHTML="";content.innerHTML="";
  sections.forEach((key,i)=>{
    const a=document.createElement("a");a.href="#"+key;a.textContent=t.names[key]||T.en.names[key];nav.appendChild(a);
    const s=document.createElement("section");s.className="card";s.id=key;
    const h=document.createElement("h2");h.innerHTML=`<span class="num">${String(i+1).padStart(2,"0")}</span><span>${t.names[key]||T.en.names[key]}</span>`;s.appendChild(h);
    const body=(t.body&&t.body[key])?t.body[key]:T.en.body[key];
    body.forEach(p=>{const el=document.createElement("p");el.textContent=format(p);s.appendChild(el)});
    if(key==="changes"){const n=document.createElement("div");n.className="note";n.textContent=format(t.note||T.en.note);s.appendChild(n)}
    if(key==="contact"){const box=document.createElement("div");box.className="contactBox";box.innerHTML=`<a class="button" href="mailto:${CONFIG.contactEmail}">✉ ${format(t.contactBtn||T.en.contactBtn)}</a><span class="button" style="cursor:default">⌂ ${CONFIG.siteHost}</span>`;s.appendChild(box)}
    content.appendChild(s);
  });
  document.getElementById("footerLine").innerHTML=`<strong>${format(t.footer||T.en.footer)}</strong>`;document.getElementById("footerLegal").textContent=format(t.footerLegal||T.en.footerLegal);
  document.getElementById("lang").value=lang;
}
const initial=detectLanguage();render(initial);
document.getElementById("lang").addEventListener("change",e=>{localStorage.setItem("privacyLang",e.target.value);render(e.target.value);window.scrollTo({top:0,behavior:"smooth"})});
</script>
</body>
</html>
