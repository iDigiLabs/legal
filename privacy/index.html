<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#08111f" />
  <title>Privacy Policy</title>
  <meta name="description" content="Universal privacy policy for our mobile applications, websites, and related digital services." />
  <style>
    :root {
      --bg:#07101d;
      --bg2:#0b1628;
      --card:rgba(18,32,54,.72);
      --card2:rgba(13,27,47,.88);
      --stroke:rgba(255,255,255,.10);
      --stroke2:rgba(135,187,255,.22);
      --text:#f4f8ff;
      --muted:#aebdd0;
      --soft:#7f94ac;
      --accent:#7c6cff;
      --accent2:#35c7ff;
      --good:#64e2b7;
      --warn:#ffd56a;
      --shadow:0 24px 80px rgba(0,0,0,.34);
      --radius:26px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(900px 560px at 12% -10%, rgba(124,108,255,.24), transparent 66%),
        radial-gradient(760px 520px at 100% 8%, rgba(53,199,255,.18), transparent 64%),
        linear-gradient(145deg,var(--bg),var(--bg2));
      line-height:1.7;
    }
    body::before{
      content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
      background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:42px 42px;
      mask-image:linear-gradient(to bottom,black,transparent 85%);
    }
    a{color:#9edfff;text-decoration:none}
    a:hover{text-decoration:underline}
    .shell{max-width:1240px;margin:0 auto;padding:28px 22px 70px}
    .topbar{
      display:flex;align-items:center;justify-content:space-between;gap:18px;
      position:sticky;top:14px;z-index:30;
      padding:12px 14px 12px 16px;border:1px solid var(--stroke);
      background:rgba(7,16,29,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.22);
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .mark{width:40px;height:40px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,rgba(124,108,255,.95),rgba(53,199,255,.92));box-shadow:0 10px 28px rgba(63,125,255,.3)}
    .mark svg{width:22px;height:22px;fill:none;stroke:white;stroke-width:1.8}
    .brandtext{min-width:0}
    .brandtitle{font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brandsub{font-size:12px;color:var(--soft)}
    .langWrap{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}
    select{
      color:var(--text);background:#0d1a2d;border:1px solid var(--stroke2);border-radius:14px;padding:10px 34px 10px 12px;outline:none;font:inherit;cursor:pointer
    }
    .hero{
      position:relative;overflow:hidden;margin:28px 0 24px;padding:46px 44px;
      border:1px solid var(--stroke);border-radius:34px;background:linear-gradient(145deg,rgba(22,38,64,.86),rgba(12,26,46,.72));box-shadow:var(--shadow)
    }
    .hero::after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;right:-130px;top:-150px;background:radial-gradient(circle,rgba(53,199,255,.2),rgba(124,108,255,.08) 46%,transparent 70%)}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(100,226,183,.26);background:rgba(100,226,183,.08);color:#aaf4d8;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em}
    h1{font-size:clamp(36px,6vw,66px);line-height:1.02;letter-spacing:-.05em;margin:18px 0 14px;max-width:850px}
    .lead{max-width:850px;color:#c5d2e3;font-size:clamp(16px,2.1vw,20px);margin:0}
    .meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
    .chip{border:1px solid var(--stroke);background:rgba(255,255,255,.035);color:var(--muted);padding:8px 11px;border-radius:999px;font-size:12px}
    .layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;align-items:start}
    .toc{position:sticky;top:94px;border:1px solid var(--stroke);border-radius:24px;background:rgba(10,23,41,.66);backdrop-filter:blur(14px);padding:18px;box-shadow:0 18px 55px rgba(0,0,0,.2)}
    .tocTitle{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--soft);font-weight:800;margin:2px 8px 10px}
    .toc a{display:block;padding:9px 10px;color:var(--muted);border-radius:11px;font-size:13px;text-decoration:none}
    .toc a:hover{color:var(--text);background:rgba(255,255,255,.05)}
    .content{display:grid;gap:16px}
    .card{scroll-margin-top:105px;border:1px solid var(--stroke);border-radius:var(--radius);padding:28px;background:linear-gradient(145deg,rgba(18,32,54,.78),rgba(10,23,41,.7));box-shadow:0 16px 46px rgba(0,0,0,.18)}
    .card h2{font-size:22px;letter-spacing:-.025em;margin:0 0 10px;display:flex;align-items:center;gap:10px}
    .num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,rgba(124,108,255,.24),rgba(53,199,255,.19));border:1px solid var(--stroke2);font-size:12px;color:#cfefff}
    .card p{color:var(--muted);margin:9px 0}
    .card ul{margin:10px 0 0;padding-left:20px;color:var(--muted)}
    .card li{margin:7px 0}
    .note{margin-top:16px;padding:14px 16px;border-radius:16px;border:1px solid rgba(255,213,106,.22);background:rgba(255,213,106,.07);color:#f3dfaa;font-size:13px}
    .contactBox{display:flex;flex-wrap:wrap;gap:12px;margin-top:15px}
    .button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--stroke2);background:linear-gradient(135deg,rgba(124,108,255,.18),rgba(53,199,255,.14));color:var(--text);padding:11px 14px;border-radius:14px;font-weight:700;font-size:13px;text-decoration:none}
    .footer{margin-top:26px;text-align:center;color:var(--soft);font-size:12px;padding:26px 12px}
    .footer strong{color:var(--muted)}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.toc{display:none}.hero{padding:36px 26px}.shell{padding:18px 14px 50px}.topbar{top:8px}.card{padding:22px}}
    @media(max-width:560px){.brandsub,.langLabel{display:none}.hero{padding:30px 20px;border-radius:26px}.card{border-radius:22px}.mark{width:36px;height:36px;border-radius:12px}select{max-width:154px}}
    @media print{body{background:white;color:#111}.topbar,.toc{display:none}.hero,.card{box-shadow:none;background:white;border:1px solid #ddd}.lead,.card p,.card ul,.chip,.footer{color:#444}.shell{max-width:900px}.layout{display:block}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.6-2.8 8.2-7 10-4.2-1.8-7-5.4-7-10V6l7-3Z"/><path d="m9.2 12 1.8 1.8 3.9-4.2"/></svg>
        </div>
        <div class="brandtext"><div class="brandtitle" id="brandTitle">Privacy Policy</div><div class="brandsub" id="brandSub">One policy for our digital services</div></div>
      </div>
      <div class="langWrap"><span class="langLabel" id="languageLabel">Language</span><select id="lang" aria-label="Language selector">
        <option value="en">English</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option><option value="pt">Português</option><option value="tr">Türkçe</option><option value="ru">Русский</option><option value="ja">日本語</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="ko">한국어</option><option value="it">Italiano</option><option value="id">Bahasa Indonesia</option>
      </select></div>
    </header>

    <section class="hero">
      <span class="eyebrow" id="eyebrow">Privacy, clearly explained</span>
      <h1 id="heroTitle">Privacy Policy</h1>
      <p class="lead" id="heroLead"></p>
      <div class="meta"><span class="chip" id="effectiveChip"></span><span class="chip" id="scopeChip"></span><span class="chip" id="noNamesChip"></span></div>
    </section>

    <div class="layout">
      <aside class="toc" aria-label="Table of contents"><div class="tocTitle" id="tocTitle">Contents</div><nav id="tocNav"></nav></aside>
      <main class="content" id="content"></main>
    </div>

    <footer class="footer"><div id="footerLine"></div><div style="margin-top:6px" id="footerLegal"></div></footer>
  </div>

<script>
const CONFIG = {
  publisherName: "iDigi Labs",
  contactEmail: "#",
  siteHost: "www.idigilabs.com",
  effectiveDate: "19 October 2026"
};

const sections = ["scope","data","permissions","purposes","thirdparties","ads","retention","security","rights","children","transfers","changes","contact"];

const T = {
  en: {
    language:"Language",brandSub:"One policy for our digital services",eyebrow:"Privacy, clearly explained",title:"Privacy Policy",
    lead:"This Privacy Policy explains how we handle information across mobile applications, websites, and related digital services published or operated by {{publisher}}.",
    effective:"Effective: {{date}}",scopeChip:"Apps, websites & related services",noNames:"No per-app policy required",toc:"Contents",
    names:{scope:"Scope",data:"Information we may process",permissions:"Device permissions",purposes:"How information is used",thirdparties:"Third-party services",ads:"Advertising",retention:"Data retention",security:"Security",rights:"Your choices & rights",children:"Children",transfers:"International processing",changes:"Changes to this policy",contact:"Contact"},
    body:{
      scope:["This policy applies to mobile applications, websites, and related digital services that are published or operated by {{publisher}} (collectively, the “Services”). A particular Service may not use every category described below.","If a Service needs a materially different privacy practice, an additional notice may be shown inside that Service. The permanent privacy-policy URL can remain the same."],
      data:["Depending on the Service and the features you use, we may process technical and operational information such as device and app information, operating-system version, language, network information, request metadata, diagnostic or crash information, feature usage, and locally stored preferences.","Some Services may process information that you actively provide, such as text entered into a form, settings, saved items, support messages, or other content required to provide the feature you requested.","A Service may also process public or technical internet data that you ask it to retrieve or analyze, such as domain, DNS, certificate, network, or website information."],
      permissions:["Some Services may request operating-system permissions when a feature requires them, for example notifications, location, camera, microphone, files/media, contacts, Bluetooth or nearby-device access. Permissions are requested only when relevant to a feature and remain subject to the controls provided by your device.","Not every Service requests these permissions. You can review or revoke permissions at any time through your device settings."],
      purposes:["We process information only as reasonably necessary to provide requested features, operate and maintain the Services, remember preferences, protect against misuse, diagnose problems, improve reliability, communicate with you, comply with legal obligations, and—where applicable—serve or measure advertising."],
      thirdparties:["Some Services may rely on third-party providers for functions such as app distribution, advertising, analytics, crash reporting, notifications, hosting, networking, payments, or other infrastructure. These providers process information under their own terms and privacy policies.","The exact providers used can vary by Service, platform, region, and feature. Examples may include platform services provided by Google or Apple and, where enabled, advertising services such as Google Mobile Ads (AdMob)."],
      ads:["Some Services may display advertising. Advertising providers may process identifiers, device information, approximate location derived from network information, interaction data, and other information permitted by your device and privacy settings in order to deliver, limit, measure, or personalize ads where legally allowed.","Where consent or another legal basis is required, applicable controls may be presented before personalized advertising is used. We do not sell personal data for money. Certain advertising activities may be considered “sharing” or “sale” under some laws; where required, applicable choices are provided."],
      retention:["We retain information only for as long as reasonably necessary for the purpose for which it is processed, to meet legal or security obligations, or to maintain the Service. Retention periods vary depending on the data and feature.","Data stored only on your device—such as preferences, history, saved items, caches, or watchlists—may remain until you delete it, clear app data, or uninstall the Service. Server-side logs and caches may be retained for limited operational and security periods."],
      security:["We use reasonable technical and organizational safeguards designed to protect information against unauthorized access, alteration, disclosure, or loss. No method of transmission or storage is completely secure, so absolute security cannot be guaranteed."],
      rights:["Depending on your location and the information involved, you may have rights to access, correct, delete, restrict, object to, or obtain a copy of personal information, and to withdraw consent where processing is based on consent.","You can also manage many privacy choices directly through device permissions, notification settings, advertising controls, app settings, or by deleting locally stored data. To submit a privacy request, contact us using the address below."],
      children:["The Services are not intended to knowingly collect personal information from children below the age required by applicable law unless a particular Service is expressly designed for children and provides the required protections and disclosures. If you believe a child has provided personal information improperly, contact us so we can review the matter."],
      transfers:["Service providers may process information in countries other than the country where you live. Where required, we use appropriate safeguards or rely on lawful transfer mechanisms provided by applicable law."],
      changes:["We may update this policy when our practices, Services, providers, or legal requirements materially change. The same permanent privacy-policy URL may continue to be used. When changes are significant, we may also provide an additional notice where appropriate."],
      contact:["For privacy questions, requests, or concerns, contact us at {{email}}. Please include enough information for us to understand your request, but do not send passwords, payment-card details, or other unnecessary sensitive information."]
    },
    note:"This universal policy is designed to remain at one permanent URL. If a future Service introduces materially different data practices, the policy or an in-service notice may need to be updated to stay accurate.",
    contactBtn:"Email privacy contact", footer:"Privacy Policy • {{publisher}}", footerLegal:"This page stores only your language preference locally in your browser."
  },
  fr: {
    language:"Langue",brandSub:"Une seule politique pour nos services numériques",eyebrow:"La confidentialité, expliquée clairement",title:"Politique de confidentialité",
    lead:"Cette politique explique comment nous traitons les informations dans les applications mobiles, sites web et services numériques associés publiés ou exploités par {{publisher}}.",
    effective:"En vigueur : {{date}}",scopeChip:"Applications, sites web et services associés",noNames:"Aucune politique séparée par application",toc:"Sommaire",
    names:{scope:"Champ d’application",data:"Informations pouvant être traitées",permissions:"Autorisations de l’appareil",purposes:"Utilisation des informations",thirdparties:"Services tiers",ads:"Publicité",retention:"Conservation des données",security:"Sécurité",rights:"Vos choix et droits",children:"Enfants",transfers:"Traitement international",changes:"Modifications de cette politique",contact:"Contact"},
    body:{scope:["Cette politique s’applique aux applications mobiles, sites web et services numériques associés publiés ou exploités par {{publisher}} (collectivement, les « Services »). Un Service donné peut ne pas utiliser toutes les catégories décrites ci-dessous.","Si un Service nécessite une pratique de confidentialité sensiblement différente, un avis supplémentaire peut être affiché dans ce Service. L’URL permanente de la politique peut rester identique."],data:["Selon le Service et les fonctionnalités utilisées, nous pouvons traiter des informations techniques et opérationnelles telles que les données de l’appareil et de l’application, la version du système, la langue, les informations réseau, les métadonnées de requête, les diagnostics, les erreurs, l’utilisation des fonctionnalités et les préférences stockées localement.","Certains Services peuvent traiter les informations que vous fournissez volontairement, par exemple du texte saisi, des réglages, des éléments enregistrés, des messages d’assistance ou tout contenu nécessaire à la fonctionnalité demandée.","Un Service peut également traiter des données internet publiques ou techniques que vous lui demandez de récupérer ou d’analyser, notamment des informations de domaine, DNS, certificat, réseau ou site web."],permissions:["Certains Services peuvent demander des autorisations du système lorsque cela est nécessaire à une fonctionnalité, par exemple notifications, localisation, caméra, microphone, fichiers/médias, contacts, Bluetooth ou appareils à proximité. Ces autorisations restent contrôlées par votre appareil.","Tous les Services ne demandent pas ces autorisations. Vous pouvez les consulter ou les révoquer dans les réglages de votre appareil."],purposes:["Nous traitons les informations uniquement lorsque cela est raisonnablement nécessaire pour fournir les fonctionnalités demandées, exploiter et maintenir les Services, mémoriser les préférences, prévenir les abus, diagnostiquer les problèmes, améliorer la fiabilité, communiquer avec vous, respecter nos obligations légales et, le cas échéant, diffuser ou mesurer la publicité."],thirdparties:["Certains Services peuvent utiliser des prestataires tiers pour la distribution, la publicité, l’analyse, les rapports de plantage, les notifications, l’hébergement, le réseau, les paiements ou d’autres fonctions d’infrastructure. Ces prestataires traitent les informations selon leurs propres conditions et politiques.","Les prestataires exacts peuvent varier selon le Service, la plateforme, la région et la fonctionnalité. Il peut notamment s’agir de services de plateforme Google ou Apple et, si activés, de services publicitaires comme Google Mobile Ads (AdMob)."],ads:["Certains Services peuvent afficher des publicités. Les fournisseurs publicitaires peuvent traiter des identifiants, des informations sur l’appareil, une localisation approximative dérivée du réseau, des données d’interaction et d’autres informations autorisées par vos réglages afin de diffuser, limiter, mesurer ou personnaliser les annonces lorsque la loi le permet.","Lorsqu’un consentement ou une autre base légale est requis, des contrôles appropriés peuvent être proposés avant l’utilisation de publicité personnalisée. Nous ne vendons pas de données personnelles contre de l’argent. Certaines activités publicitaires peuvent être qualifiées de « partage » ou de « vente » par certaines lois ; lorsque nécessaire, des choix adaptés sont proposés."],retention:["Nous conservons les informations uniquement pendant la durée raisonnablement nécessaire à leur finalité, aux obligations légales ou de sécurité, ou au maintien du Service. Les durées varient selon les données et fonctionnalités.","Les données stockées uniquement sur votre appareil — préférences, historique, éléments enregistrés, caches ou listes de suivi — peuvent rester jusqu’à leur suppression, l’effacement des données de l’application ou sa désinstallation. Les journaux et caches serveur peuvent être conservés pendant des périodes opérationnelles et de sécurité limitées."],security:["Nous utilisons des mesures techniques et organisationnelles raisonnables destinées à protéger les informations contre l’accès, la modification, la divulgation ou la perte non autorisés. Aucun moyen de transmission ou de stockage n’est totalement sûr ; une sécurité absolue ne peut donc pas être garantie."],rights:["Selon votre lieu de résidence et les données concernées, vous pouvez disposer de droits d’accès, de rectification, de suppression, de limitation, d’opposition ou de portabilité, ainsi que du droit de retirer votre consentement lorsqu’il constitue la base du traitement.","Vous pouvez également gérer de nombreux choix via les autorisations de l’appareil, les notifications, les contrôles publicitaires, les réglages de l’application ou la suppression des données locales. Pour une demande relative à la confidentialité, contactez-nous ci-dessous."],children:["Les Services ne sont pas destinés à collecter sciemment des informations personnelles auprès d’enfants n’ayant pas l’âge requis par la loi applicable, sauf lorsqu’un Service est expressément conçu pour eux et fournit les protections et informations requises. Si vous pensez qu’un enfant a fourni des informations de manière inappropriée, contactez-nous."],transfers:["Des prestataires peuvent traiter des informations dans des pays autres que votre pays de résidence. Lorsque cela est requis, nous utilisons des garanties appropriées ou des mécanismes de transfert autorisés par la loi applicable."],changes:["Nous pouvons mettre cette politique à jour si nos pratiques, Services, prestataires ou obligations légales changent de manière significative. La même URL permanente peut continuer à être utilisée. En cas de changement important, un avis supplémentaire peut être fourni lorsque cela est approprié."],contact:["Pour toute question ou demande concernant la confidentialité, écrivez-nous à {{email}}. Fournissez suffisamment d’informations pour que nous comprenions votre demande, mais n’envoyez pas de mot de passe, de carte bancaire ou d’autres données sensibles inutiles."]},
    note:"Cette politique universelle est conçue pour rester accessible à une URL permanente. Si un futur Service introduit des pratiques de données sensiblement différentes, la politique ou un avis intégré pourra devoir être mis à jour pour rester exact.",contactBtn:"Contacter la confidentialité",footer:"Politique de confidentialité • {{publisher}}",footerLegal:"Cette page enregistre uniquement votre préférence de langue localement dans votre navigateur."
  },
  de: {
    language:"Sprache",brandSub:"Eine Richtlinie für unsere digitalen Dienste",eyebrow:"Datenschutz klar erklärt",title:"Datenschutzerklärung",lead:"Diese Datenschutzerklärung erläutert, wie wir Informationen in mobilen Apps, Websites und zugehörigen digitalen Diensten verarbeiten, die von {{publisher}} veröffentlicht oder betrieben werden.",effective:"Gültig ab: {{date}}",scopeChip:"Apps, Websites & zugehörige Dienste",noNames:"Keine separate Richtlinie pro App",toc:"Inhalt",
    names:{scope:"Geltungsbereich",data:"Informationen, die wir verarbeiten können",permissions:"Geräteberechtigungen",purposes:"Verwendung von Informationen",thirdparties:"Drittanbieter",ads:"Werbung",retention:"Speicherdauer",security:"Sicherheit",rights:"Ihre Wahlmöglichkeiten und Rechte",children:"Kinder",transfers:"Internationale Verarbeitung",changes:"Änderungen dieser Richtlinie",contact:"Kontakt"},
    body:{scope:["Diese Richtlinie gilt für mobile Apps, Websites und zugehörige digitale Dienste, die von {{publisher}} veröffentlicht oder betrieben werden (zusammen die „Dienste“). Ein einzelner Dienst nutzt möglicherweise nicht alle unten beschriebenen Kategorien.","Benötigt ein Dienst wesentlich abweichende Datenschutzpraktiken, kann innerhalb dieses Dienstes ein zusätzlicher Hinweis angezeigt werden. Die dauerhafte URL dieser Richtlinie kann dabei unverändert bleiben."],data:["Je nach Dienst und verwendeten Funktionen können wir technische und betriebliche Informationen verarbeiten, etwa Geräte- und App-Informationen, Betriebssystemversion, Sprache, Netzwerkinformationen, Anfrage-Metadaten, Diagnose- oder Absturzdaten, Funktionsnutzung und lokal gespeicherte Einstellungen.","Einige Dienste verarbeiten Informationen, die Sie aktiv bereitstellen, z. B. eingegebenen Text, Einstellungen, gespeicherte Elemente, Support-Nachrichten oder andere Inhalte, die für die gewünschte Funktion erforderlich sind.","Ein Dienst kann außerdem öffentliche oder technische Internetdaten verarbeiten, die Sie abrufen oder analysieren lassen, z. B. Domain-, DNS-, Zertifikats-, Netzwerk- oder Website-Informationen."],permissions:["Einige Dienste können Systemberechtigungen anfordern, wenn eine Funktion sie benötigt, beispielsweise Benachrichtigungen, Standort, Kamera, Mikrofon, Dateien/Medien, Kontakte, Bluetooth oder Geräte in der Nähe. Berechtigungen unterliegen weiterhin den Kontrollen Ihres Geräts.","Nicht jeder Dienst fordert diese Berechtigungen an. Sie können sie jederzeit in den Geräteeinstellungen prüfen oder widerrufen."],purposes:["Wir verarbeiten Informationen nur, soweit dies vernünftigerweise erforderlich ist, um angeforderte Funktionen bereitzustellen, die Dienste zu betreiben und zu warten, Einstellungen zu speichern, Missbrauch zu verhindern, Probleme zu diagnostizieren, die Zuverlässigkeit zu verbessern, mit Ihnen zu kommunizieren, rechtliche Pflichten zu erfüllen und gegebenenfalls Werbung auszuliefern oder zu messen."],thirdparties:["Einige Dienste können Drittanbieter für App-Verteilung, Werbung, Analyse, Absturzberichte, Benachrichtigungen, Hosting, Netzwerk, Zahlungen oder andere Infrastruktur nutzen. Diese Anbieter verarbeiten Informationen nach ihren eigenen Bedingungen und Datenschutzrichtlinien.","Die konkret eingesetzten Anbieter können je nach Dienst, Plattform, Region und Funktion variieren. Beispiele sind Plattformdienste von Google oder Apple und, sofern aktiviert, Werbedienste wie Google Mobile Ads (AdMob)."],ads:["Einige Dienste können Werbung anzeigen. Werbeanbieter können Kennungen, Geräteinformationen, aus Netzwerkinformationen abgeleiteten ungefähren Standort, Interaktionsdaten und weitere durch Ihre Geräte- und Datenschutzeinstellungen erlaubte Informationen verarbeiten, um Anzeigen auszuliefern, zu begrenzen, zu messen oder – soweit rechtlich zulässig – zu personalisieren.","Wo eine Einwilligung oder andere Rechtsgrundlage erforderlich ist, können entsprechende Kontrollen vor personalisierter Werbung angeboten werden. Wir verkaufen personenbezogene Daten nicht gegen Geld. Bestimmte Werbeaktivitäten können nach einigen Gesetzen als „Teilen“ oder „Verkauf“ gelten; wo erforderlich, stellen wir entsprechende Wahlmöglichkeiten bereit."],retention:["Wir speichern Informationen nur so lange, wie dies für den jeweiligen Zweck, gesetzliche oder sicherheitsbezogene Pflichten oder den Betrieb des Dienstes vernünftigerweise erforderlich ist. Die Dauer hängt von Datenart und Funktion ab.","Daten, die nur auf Ihrem Gerät gespeichert sind – etwa Einstellungen, Verlauf, gespeicherte Elemente, Caches oder Watchlists – können verbleiben, bis Sie sie löschen, App-Daten entfernen oder den Dienst deinstallieren. Serverprotokolle und Caches können für begrenzte Betriebs- und Sicherheitszeiträume gespeichert werden."],security:["Wir setzen angemessene technische und organisatorische Schutzmaßnahmen ein, die Informationen vor unbefugtem Zugriff, Veränderung, Offenlegung oder Verlust schützen sollen. Keine Übertragungs- oder Speichermethode ist vollkommen sicher; absolute Sicherheit kann daher nicht garantiert werden."],rights:["Je nach Standort und betroffenen Informationen können Sie Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung, Widerspruch oder Datenkopie sowie auf Widerruf einer Einwilligung haben.","Viele Datenschutzentscheidungen können Sie außerdem direkt über Geräteberechtigungen, Benachrichtigungseinstellungen, Werbekontrollen, App-Einstellungen oder das Löschen lokaler Daten verwalten. Für Datenschutzanfragen kontaktieren Sie uns unten."],children:["Die Dienste sind nicht darauf ausgerichtet, wissentlich personenbezogene Daten von Kindern unter dem nach geltendem Recht erforderlichen Alter zu erheben, außer ein bestimmter Dienst ist ausdrücklich für Kinder vorgesehen und bietet die erforderlichen Schutzmaßnahmen und Hinweise. Wenn Sie vermuten, dass ein Kind unangemessen personenbezogene Daten bereitgestellt hat, kontaktieren Sie uns."],transfers:["Dienstleister können Informationen in anderen Ländern als Ihrem Wohnsitzland verarbeiten. Soweit erforderlich, verwenden wir angemessene Garantien oder gesetzlich vorgesehene Übermittlungsmechanismen."],changes:["Wir können diese Richtlinie aktualisieren, wenn sich unsere Praktiken, Dienste, Anbieter oder rechtlichen Anforderungen wesentlich ändern. Dieselbe dauerhafte URL kann weiterverwendet werden. Bei erheblichen Änderungen können wir zusätzlich einen geeigneten Hinweis bereitstellen."],contact:["Bei Datenschutzfragen, Anfragen oder Bedenken kontaktieren Sie uns unter {{email}}. Geben Sie genügend Informationen an, damit wir Ihre Anfrage verstehen, senden Sie jedoch keine Passwörter, Zahlungskartendaten oder unnötige sensible Informationen."]},
    note:"Diese universelle Richtlinie ist für eine dauerhafte URL gedacht. Falls ein zukünftiger Dienst wesentlich andere Datenpraktiken einführt, muss die Richtlinie oder ein Hinweis im Dienst gegebenenfalls aktualisiert werden, damit die Angaben korrekt bleiben.",contactBtn:"Datenschutz kontaktieren",footer:"Datenschutzerklärung • {{publisher}}",footerLegal:"Diese Seite speichert nur Ihre Sprachpräferenz lokal in Ihrem Browser."
  },
  es: {
    language:"Idioma",brandSub:"Una sola política para nuestros servicios digitales",eyebrow:"Privacidad explicada con claridad",title:"Política de privacidad",lead:"Esta Política de privacidad explica cómo tratamos la información en aplicaciones móviles, sitios web y servicios digitales relacionados publicados u operados por {{publisher}}.",effective:"Vigente desde: {{date}}",scopeChip:"Apps, sitios web y servicios relacionados",noNames:"Sin política separada por aplicación",toc:"Contenido",
    names:{scope:"Ámbito",data:"Información que podemos tratar",permissions:"Permisos del dispositivo",purposes:"Cómo usamos la información",thirdparties:"Servicios de terceros",ads:"Publicidad",retention:"Conservación de datos",security:"Seguridad",rights:"Tus opciones y derechos",children:"Menores",transfers:"Tratamiento internacional",changes:"Cambios en esta política",contact:"Contacto"},
    body:{scope:["Esta política se aplica a aplicaciones móviles, sitios web y servicios digitales relacionados publicados u operados por {{publisher}} (conjuntamente, los “Servicios”). Un Servicio concreto puede no utilizar todas las categorías descritas a continuación.","Si un Servicio necesita prácticas de privacidad sustancialmente diferentes, puede mostrar un aviso adicional dentro de ese Servicio. La URL permanente de esta política puede seguir siendo la misma."],data:["Según el Servicio y las funciones que utilices, podemos tratar información técnica y operativa como datos del dispositivo y de la aplicación, versión del sistema, idioma, red, metadatos de solicitudes, diagnósticos o fallos, uso de funciones y preferencias almacenadas localmente.","Algunos Servicios pueden tratar información que proporcionas activamente, como texto introducido, ajustes, elementos guardados, mensajes de soporte u otros contenidos necesarios para ofrecer la función solicitada.","Un Servicio también puede tratar datos públicos o técnicos de Internet que le pidas consultar o analizar, como información de dominio, DNS, certificados, red o sitios web."],permissions:["Algunos Servicios pueden solicitar permisos del sistema cuando una función los requiera, por ejemplo notificaciones, ubicación, cámara, micrófono, archivos/medios, contactos, Bluetooth o dispositivos cercanos. Los permisos siguen sujetos a los controles de tu dispositivo.","No todos los Servicios solicitan estos permisos. Puedes revisarlos o revocarlos en cualquier momento desde los ajustes del dispositivo."],purposes:["Tratamos la información solo cuando es razonablemente necesario para ofrecer las funciones solicitadas, operar y mantener los Servicios, recordar preferencias, proteger frente a abusos, diagnosticar problemas, mejorar la fiabilidad, comunicarnos contigo, cumplir obligaciones legales y, cuando corresponda, mostrar o medir publicidad."],thirdparties:["Algunos Servicios pueden utilizar proveedores externos para distribución, publicidad, analítica, informes de fallos, notificaciones, alojamiento, red, pagos u otra infraestructura. Estos proveedores tratan la información conforme a sus propios términos y políticas.","Los proveedores exactos pueden variar según el Servicio, la plataforma, la región y la función. Algunos ejemplos son servicios de plataforma de Google o Apple y, cuando estén habilitados, servicios publicitarios como Google Mobile Ads (AdMob)."],ads:["Algunos Servicios pueden mostrar publicidad. Los proveedores publicitarios pueden tratar identificadores, información del dispositivo, ubicación aproximada derivada de la red, datos de interacción y otra información permitida por tus ajustes para mostrar, limitar, medir o personalizar anuncios cuando la ley lo permita.","Cuando se requiera consentimiento u otra base legal, pueden mostrarse los controles correspondientes antes de utilizar publicidad personalizada. No vendemos datos personales a cambio de dinero. Ciertas actividades publicitarias pueden considerarse “compartir” o “vender” según algunas leyes; cuando sea necesario, ofrecemos las opciones aplicables."],retention:["Conservamos la información solo durante el tiempo razonablemente necesario para su finalidad, obligaciones legales o de seguridad, o mantenimiento del Servicio. Los periodos varían según los datos y la función.","Los datos almacenados solo en tu dispositivo —como preferencias, historial, elementos guardados, cachés o listas de seguimiento— pueden permanecer hasta que los elimines, borres los datos de la app o desinstales el Servicio. Los registros y cachés del servidor pueden conservarse durante periodos operativos y de seguridad limitados."],security:["Aplicamos medidas técnicas y organizativas razonables diseñadas para proteger la información frente a acceso, modificación, divulgación o pérdida no autorizados. Ningún método de transmisión o almacenamiento es completamente seguro, por lo que no puede garantizarse una seguridad absoluta."],rights:["Según tu ubicación y la información implicada, puedes tener derechos de acceso, rectificación, eliminación, limitación, oposición u obtención de una copia, así como retirar el consentimiento cuando el tratamiento se base en él.","También puedes gestionar muchas opciones de privacidad mediante permisos del dispositivo, notificaciones, controles publicitarios, ajustes de la app o eliminando datos locales. Para una solicitud de privacidad, contáctanos abajo."],children:["Los Servicios no están destinados a recopilar conscientemente información personal de menores por debajo de la edad exigida por la ley aplicable, salvo que un Servicio esté expresamente diseñado para menores y proporcione las protecciones y avisos requeridos. Si crees que un menor ha proporcionado información de forma inadecuada, contáctanos."],transfers:["Los proveedores pueden tratar información en países distintos del país donde resides. Cuando sea necesario, usamos garantías apropiadas o mecanismos de transferencia permitidos por la ley aplicable."],changes:["Podemos actualizar esta política cuando cambien de forma sustancial nuestras prácticas, Servicios, proveedores o requisitos legales. La misma URL permanente puede seguir utilizándose. Cuando los cambios sean importantes, también podemos proporcionar un aviso adicional cuando corresponda."],contact:["Para preguntas, solicitudes o inquietudes sobre privacidad, escríbenos a {{email}}. Incluye información suficiente para entender tu solicitud, pero no envíes contraseñas, datos de tarjetas u otra información sensible innecesaria."]},
    note:"Esta política universal está diseñada para permanecer en una URL permanente. Si un Servicio futuro introduce prácticas de datos sustancialmente diferentes, puede ser necesario actualizar la política o mostrar un aviso dentro del Servicio para mantener la información exacta.",contactBtn:"Contactar sobre privacidad",footer:"Política de privacidad • {{publisher}}",footerLegal:"Esta página solo guarda tu preferencia de idioma localmente en el navegador."
  }
};
